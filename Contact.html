<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            box-sizing: border-box;
            padding: 0;
        }
        header{
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #222222;
            height: 70px;
            padding-left: 40px;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
            text-decoration: none;
            font-weight: bold;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        ul li{
            display: inline;
            margin: 10px;
            margin-right: 20px;
        }
        a:hover{
            color: tomato;
        }
        main{
            background-color: #f9f9f9;
        }
        #heading-2{
            border: 1px solid #ffffff;
            height: 300px;
            width: 1000px;
            background-color: #ffffff;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            margin-bottom: 80px;
            margin-left: 100px;
            margin-right: 100px;
            
        }
        #heading-5{
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            color: #333333;
            margin-top: 50px;
            font-size: xx-large;
        }
       
        
        footer{
            background-color: #222222;
            height: 80px;
            text-align: center;
            padding-top: 25px;
            color: white;
            margin-top: 20px;
            font-size: medium;
            font-family: Arial, Helvetica, sans-serif;
            margin-bottom: 0px;
        }
        .heading-1{
            font-size: large;
        }
        #active a{
            color: tomato;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>MyPortfolio</h2>
        </div>
        <div class="nav">
            <Ul>
                <li id="active"><a href=#">Home</a> </li>
                <li><a href="website-about.html">About</a></li>
                <li><a href="#">Projects</a></li>
                <li style="padding-right: 50px;"><a href="#">Contact</a></li>
            </Ul>
        </div>
    </header>
    <h2 id="heading-5">Contact Me</h2>
    <main>
        <div id="heading-2">
            <label for="name">Name:</label><br>
            <input type="text" id="name" placeholder="Enter Your Name"><br>
            <label for="Email">Email:</label><br>
            <input type="email" id="Email" placeholder="Enter Your email"><br>
            <label for="Message">Message:</label><br>
            <input type="text" id="Message" placeholder="Write your message..."><br>
            
            
        </div>
    </main>
    <footer>© 2025 MyPortfolio | Follow me:   </footer>

</html>
