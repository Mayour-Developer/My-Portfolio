  :root {
  /* Set your percentage value here (from 0% to 100%) */
  --percentage: 75%;
  --circle-size: 150px;
  --bar-color: #3498db;
  --track-color: #e0e0e0;
}

.percentage-circle {
  position: relative;
  width: var(--circle-size);
  height: var(--circle-size);
  border-radius: 50%;
  
  /* Creates the progress ring effect */
  background: conic-gradient(
    var(--bar-color) var(--percentage), 
    var(--track-color) 0
  );
  
  display: flex;
  align-items: center;
  justify-content: center;
}

.inner-circle {
  width: calc(var(--circle-size) - 20px);
  height: calc(var(--circle-size) - 20px);
  border-radius: 50%;
  background-color: #ffffff;
  
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: sans-serif;
  font-size: 1.5rem;
  font-weight: bold;
  color: #333;
}

   :root {
  --percentage: 87%;
  --ring-dimensions: 150px;
  --fill-color: #2ecc71;   /* Changed to an alternative green accent */
  --base-color: #f1f2f6;   /* Soft off-white track color */
}

.progress-ring {
  position: relative;
  width: var(--ring-dimensions);
  height: var(--ring-dimensions);
  border-radius: 50%;
  
  /* Creates the progress look using the new variables */
  background: conic-gradient(
    var(--fill-color) var(--percentage), 
    var(--base-color) 0
  );
  
  display: flex;
  align-items: center;
  justify-content: center;
}

.ring-label {
  width: calc(var(--ring-dimensions) - 24px); /* Slightly thicker ring border */
  height: calc(var(--ring-dimensions) - 24px);
  border-radius: 50%;
  background-color: #ffffff;
  
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: #2f3542;
}

:root {
  --percentage: 99.9%;
  --circle-diameter: 150px;
  --accent-color: #9b59b6;  /* Sleek purple variation */
  --track-color: #f5f6fa;   /* Very light clean track grey */
}

.metric-circle {
  position: relative;
  width: var(--circle-diameter);
  height: var(--circle-diameter);
  border-radius: 50%;
  
  /* Applies the 99.9% value via conic gradient */
  background: conic-gradient(
    var(--accent-color) var(--percentage), 
    var(--track-color) 0
  );
  
  display: flex;
  align-items: center;
  justify-content: center;
}

.metric-value {
  width: calc(var(--circle-diameter) - 24px); 
  height: calc(var(--circle-diameter) - 24px);
  border-radius: 50%;
  background-color: #ffffff;
  
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 1.4rem; 
  font-weight: 700;
  color: #2c3e50;
}
